  <line x1="50" y1="28" x2="50" y2="72" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="50" y1="35" x2="43" y2="42" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="35" x2="57" y2="42" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="65" x2="43" y2="58" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="65" x2="57" y2="58" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <line x1="30" y1="39" x2="70" y2="61" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="30" y1="61" x2="70" y2="39" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <circle cx="50" cy="50" r="4" fill="#ffffff" />
