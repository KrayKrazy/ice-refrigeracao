<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#071527" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Escudo / Brasão Técnico -->
  <g transform="translate(10, 10)">
    <!-- Fundo do Emblema -->
    <path d="M50 0 L90 18 L90 62 C90 85 50 98 50 98 C50 98 10 85 10 62 L10 18 Z" 
          fill="url(#shieldGrad)" stroke="url(#iceGrad)" stroke-width="2.5" />

    <!-- Floco de Neve / Ice Crystal Central -->
    <!-- Eixo Vertical -->
    <line x1="50" y1="20" x2="50" y2="76" stroke="url(#iceGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="50" y1="28" x2="42" y2="36" stroke="url(#iceGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="50" y1="28" x2="58" y2="36" stroke="url(#iceGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="50" y1="68" x2="42" y2="60" stroke="url(#iceGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="50" y1="68" x2="58" y2="60" stroke="url(#iceGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eixo Diagonal 1 -->
    <line x1="25" y1="34" x2="75" y2="62" stroke="url(#iceGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="33" y1="38" x2="31" y2="48" stroke="url(#iceGrad)" stroke-width="2" stroke-linecap="round" />
    <line x1="67" y1="58" x2="69" y2="48" stroke="url(#iceGrad)" stroke-width="2" stroke-linecap="round" />

    <!-- Eixo Diagonal 2 -->
    <line x1="25" y1="62" x2="75" y2="34" stroke="url(#iceGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="33" y1="58" x2="31" y2="48" stroke="url(#iceGrad)" stroke-width="2" stroke-linecap="round" />
    <line x1="67" y1="38" x2="69" y2="48" stroke="url(#iceGrad)" stroke-width="2" stroke-linecap="round" />

    <!-- Núcleo de Frio -->
    <circle cx="50" cy="48" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Tipografia da Marca -->
  <text x="120" y="58" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="url(#textGrad)" letter-spacing="1">
    ICE
  </text>
  <text x="205" y="58" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="36" fill="url(#accentGrad)" letter-spacing="0.5">
    REFRIGERAÇÃO
  </text>

  <!-- Tagline / Subtítulo Técnico -->
  <text x="122" y="86" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="2.5">
    ASSISTÊNCIA TÉCNICA LINHA BRANCA & DOMICÍLIO
  </text>

  <!-- Selo de Garantia / Brasília DF -->
  <rect x="445" y="24" width="85" height="22" rx="11" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
  <text x="487" y="39" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10.5" fill="#38bdf8" letter-spacing="0.5">
    DF & ENTORNO
  </text>
</svg>
